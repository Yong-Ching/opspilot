[project]
name = "hc-pms"
version = "0.1.0"
description = "Harbourfront Capital legacy Portfolio Management System (simulated existing system)"
readme = "README.md"
authors = [
    { name = "Yong-Ching", email = "yongching97@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.1",
    "httpx>=0.28.1",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
hc-pms = "hc_pms:main"
hc-pms-load = "hc_pms.load:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["hc_pms"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
